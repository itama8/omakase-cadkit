name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source setup and smoke (Linux, Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.4'
      - run: npm ci
      # runner.* is only available in step-level env, not job-level env.
      - name: Build, generate fixtures, typecheck, and test
        run: npm run setup
        env:
          OMAKASE_CADKIT_CACHE: ${{ runner.temp }}/omakase-cadkit-cache
      - name: Exercise CLI and viewer endpoints
        run: npm run smoke
        env:
          OMAKASE_CADKIT_CACHE: ${{ runner.temp }}/omakase-cadkit-cache
