name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source setup and smoke (Linux, Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.4'
          # Fixtures use `uv run --with ezdxf`, so there is no lock file to key
          # a cache on. An unkeyed cache would never invalidate.
          enable-cache: false
      - run: npm ci
      # runner.* is only available in step-level env, not job-level env.
      - name: Build, generate fixtures, typecheck, and test
        run: npm run setup
        env:
          OMAKASE_CADKIT_CACHE: ${{ runner.temp }}/omakase-cadkit-cache
      - name: Exercise CLI and viewer endpoints
        run: npm run smoke
        env:
          OMAKASE_CADKIT_CACHE: ${{ runner.temp }}/omakase-cadkit-cache
      - name: Exercise the library from a separate consumer
        run: npm run consumer
        env:
          OMAKASE_CADKIT_CACHE: ${{ runner.temp }}/omakase-cadkit-consumer-cache

  bootstrap:
    name: Bootstrap (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon, macos-15-intel is Intel: both Mac architectures.
        os: [ubuntu-24.04, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Force local tools so runner-provided dependencies cannot hide download failures.
      - name: Bootstrap on macOS and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: bash setup.command --local-tools
      - name: Bootstrap on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/bootstrap.ps1 -LocalTools
      - name: Launch without a drawing (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash launch.command --no-open --port 4289
      - name: Launch without a drawing (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: launch.cmd --no-open --port 4289
      # The launcher is what a tester uses: saved local tools, a real drawing, sidecar and
      # viewer. A green setup is not enough, the drawing has to open through it.
      - name: Open a drawing through Launch (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash launch.command view fixtures/sewer_bad.dxf --no-open --port 4289
          doc="$(pwd)/fixtures/sewer_bad.dxf"
          out="${RUNNER_TEMP:-/tmp}"
          curl -fsS --compressed "http://127.0.0.1:4289/api/health" -o "$out/health.json"
          grep -q omakase-cadkit "$out/health.json"
          curl -fsS --compressed "http://127.0.0.1:4289/api/drawing?file=$doc" -o "$out/drawing.json"
          grep -q '"prims"' "$out/drawing.json"
          curl -fsS --compressed "http://127.0.0.1:4289/api/lint?file=$doc" -o "$out/lint.json"
          grep -q sewer-levels "$out/lint.json"
      - name: Open a drawing through Launch (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          cmd /c launch.cmd view fixtures\sewer_bad.dxf --no-open --port 4289
          if ($LASTEXITCODE -ne 0) { throw "view failed with exit code $LASTEXITCODE" }
          $doc = (Get-Location).Path + '\fixtures\sewer_bad.dxf'
          $out = $env:RUNNER_TEMP
          curl.exe -fsS --compressed 'http://127.0.0.1:4289/api/health' -o "$out\health.json"
          if ($LASTEXITCODE -ne 0) { throw 'health request failed' }
          if (-not (Select-String -Path "$out\health.json" -Pattern 'omakase-cadkit' -Quiet)) { throw 'health does not name the app' }
          curl.exe -fsS --compressed "http://127.0.0.1:4289/api/drawing?file=$doc" -o "$out\drawing.json"
          if ($LASTEXITCODE -ne 0) { throw 'drawing request failed' }
          if (-not (Select-String -Path "$out\drawing.json" -Pattern '"prims"' -Quiet)) { throw 'drawing has no prims' }
          curl.exe -fsS --compressed "http://127.0.0.1:4289/api/lint?file=$doc" -o "$out\lint.json"
          if ($LASTEXITCODE -ne 0) { throw 'lint request failed' }
          if (-not (Select-String -Path "$out\lint.json" -Pattern 'sewer-levels' -Quiet)) { throw 'no sewer-levels finding' }
